<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    The app icon: the heroine, in front of the summoning circle. She is the same drawing
    as in the app (src/components/Heroine.tsx), in her cheerful mood. scripts/gen-icons.mjs
    turns this into every size needed; it rounds the corners (every rx="0") and uses the
    groups named detail, heroine and spark.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a3486"/>
      <stop offset="0.55" stop-color="#141a45"/>
      <stop offset="1" stop-color="#090b17"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6fd6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6fd6ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="0"/></clipPath>
  </defs>
  <rect id="plate" width="512" height="512" rx="0" fill="url(#bg)"/>

  <g clip-path="url(#clip)">
    <g id="detail">
      <circle cx="256" cy="256" r="236" fill="url(#glow)"/>
      <circle cx="256" cy="256" r="206" fill="none" stroke="#6fd6ff" stroke-width="7" opacity="0.85"/>
      <circle cx="256" cy="256" r="184" fill="none" stroke="#6fd6ff" stroke-width="3" stroke-dasharray="5 15" opacity="0.6"/>
    </g>

    <g id="heroine" transform="translate(256 262) scale(4.5) translate(-60 -57)">
      <!-- long hair behind, then the red cape from one shoulder -->
      <path d="M27 56 C22 14 98 14 93 56 C98 80 101 108 98 132 L22 132 C19 108 22 80 27 56 Z" fill="#c3c8da"/>
      <path d="M66 90 L80 91 C91 104 98 120 101 137 L87 141 C86 124 81 108 72 96 Z" fill="#c9303f" stroke="#f3c452" stroke-width="1.5" stroke-linejoin="round"/>

      <!-- neck, blouse and vest -->
      <rect x="56.5" y="80" width="7" height="13" fill="#f1c2ab"/>
      <path d="M49.5 91 C48 97 47 103 46.5 109 L46 132 L74 132 L73.5 109 C73 103 72 97 70.5 91 Z" fill="#f7f8fc"/>
      <path d="M48.7 95.5 L55 95.5 L60 102.5 L65 95.5 L71.3 95.5 L73.5 109 L74 132 L46 132 L46.5 109 Z" fill="#383b4a"/>
      <path d="M55 95.5 L60 102.5 L65 95.5" fill="none" stroke="#f3c452" stroke-width="0.9" stroke-linejoin="round"/>
      <circle cx="54.6" cy="101" r="0.9" fill="#f3c452"/>
      <circle cx="65.4" cy="101" r="0.9" fill="#f3c452"/>
      <circle cx="55.6" cy="104.6" r="0.9" fill="#f3c452"/>
      <circle cx="64.4" cy="104.6" r="0.9" fill="#f3c452"/>

      <!-- sleeves and the gold epaulette -->
      <path d="M48 96 L40.6 113.4" stroke="#f7f8fc" stroke-width="7" stroke-linecap="round"/>
      <circle cx="48.4" cy="96.4" r="5.4" fill="#dde1ee"/>
      <path d="M72 96 L79.4 113.4" stroke="#f7f8fc" stroke-width="7" stroke-linecap="round"/>
      <circle cx="71.6" cy="96.4" r="5.4" fill="#dde1ee"/>
      <path d="M70.5 95.6 v3.2 M73 96.4 v3.2 M75.5 96.7 v3.2 M78 96.4 v3.2 M80.5 95.6 v3.2" stroke="#f3c452" stroke-width="1.3" stroke-linecap="round"/>
      <ellipse cx="75.5" cy="93" rx="7.2" ry="3.5" fill="#f3c452"/>
      <ellipse cx="75.5" cy="92.4" rx="5" ry="1.8" fill="#ffe08a"/>

      <!-- collar and bow -->
      <path d="M53 89.5 L60 95 L67 89.5 L65 87.2 L60 91 L55 87.2 Z" fill="#fff"/>
      <path d="M60 94.5 L52.8 91 L53.6 98 Z M60 94.5 L67.2 91 L66.4 98 Z" fill="#c9303f"/>
      <circle cx="60" cy="94.5" r="2" fill="#6fd6ff" stroke="#f3c452" stroke-width="0.7"/>

      <!-- face -->
      <ellipse cx="60" cy="59" rx="26.5" ry="24.5" fill="#ffe6d6"/>
      <ellipse cx="40.5" cy="71.5" rx="4.6" ry="2.6" fill="#ff8fa3" opacity="0.55"/>
      <ellipse cx="79.5" cy="71.5" rx="4.6" ry="2.6" fill="#ff8fa3" opacity="0.55"/>
      <ellipse cx="48" cy="64" rx="4.7" ry="6.1" fill="#33213a"/>
      <ellipse cx="48" cy="66" rx="3.2" ry="3.4" fill="#e23f55"/>
      <circle cx="46.4" cy="61.4" r="1.9" fill="#fff"/>
      <circle cx="49.9" cy="66.6" r="0.85" fill="#fff" opacity="0.85"/>
      <path d="M42.3 60.2 Q48 55.4 53.7 60.2" fill="none" stroke="#33213a" stroke-width="1.7" stroke-linecap="round"/>
      <ellipse cx="72" cy="64" rx="4.7" ry="6.1" fill="#33213a"/>
      <ellipse cx="72" cy="66" rx="3.2" ry="3.4" fill="#e23f55"/>
      <circle cx="70.4" cy="61.4" r="1.9" fill="#fff"/>
      <circle cx="73.9" cy="66.6" r="0.85" fill="#fff" opacity="0.85"/>
      <path d="M66.3 60.2 Q72 55.4 77.7 60.2" fill="none" stroke="#33213a" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M55 73.5 Q60 79 65 73.5" fill="none" stroke="#b23a5c" stroke-width="1.8" stroke-linecap="round"/>

      <!-- fringe, side locks, the loose strand, and the gold leaf clip -->
      <path d="M32.5 60 C29 18 91 18 87.5 60 C86.5 56 84 53 81 51 C79 55 75 57.5 70 58 C70 53 68 49 65 46 C64 52 62 58 60 62 C58 56 55 50 51 46 C50 51 47 56 43 58 C43.5 55 42 52 39.5 51 C36.5 53 34 56 32.5 60 Z" fill="#eceef6"/>
      <path d="M32.5 54 C29.5 70 30 90 34.5 104 C38 90 39.5 70 38.5 54 Z" fill="#eceef6"/>
      <path d="M87.5 54 C90.5 70 90 90 85.5 104 C82 90 80.5 70 81.5 54 Z" fill="#eceef6"/>
      <path d="M42 37.5 Q52 29.5 66 29.5" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M58 28 C54 16 64 10 70 16 C65 16 62 20 63 28 Z" fill="#eceef6"/>
      <path d="M84.5 45 L90 42.5 L89 49 Z M84.5 45 L86.5 52.5 L81.5 50.5 Z" fill="#2d2f3a"/>
      <path d="M76 45.5 Q78 36.5 86 36.5 Q84.5 45 76 45.5 Z" fill="#f3c452"/>
    </g>

    <g id="spark" fill="#fff6cf">
      <path d="M436 92 l9 24 24 9 -24 9 -9 24 -9 -24 -24 -9 24 -9 z"/>
      <path d="M70 128 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 z" opacity="0.8"/>
    </g>
  </g>
</svg>
