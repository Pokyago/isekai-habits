<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#27307a"/>
      <stop offset="1" stop-color="#090b17"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e0a52e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- summoning circle -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#6fd6ff" stroke-width="8" opacity="0.9"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#6fd6ff" stroke-width="3" stroke-dasharray="6 14" opacity="0.7"/>
  <!-- rank diamond -->
  <rect x="176" y="176" width="160" height="160" rx="18" transform="rotate(45 256 256)" fill="#12162c" stroke="url(#gold)" stroke-width="12"/>
  <!-- upward arrow: level up -->
  <path d="M256 190 L316 262 H280 V322 H232 V262 H196 Z" fill="url(#gold)"/>
